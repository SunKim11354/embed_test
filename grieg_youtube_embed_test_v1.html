<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그리그 YouTube 임베딩 테스트 V1</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f6f9;color:#182332;margin:0;padding:20px}.wrap{max-width:760px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 4px 24px #14203818}h1{font-size:23px;margin:0 0 8px}p{line-height:1.6}.muted{color:#586579}.player{width:100%;max-width:560px;aspect-ratio:16/9;min-height:200px;background:#171717;margin:16px auto;border-radius:8px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}button{font-size:16px;padding:12px 16px;border:1px solid #ccd3df;background:#fff;border-radius:10px;cursor:pointer}button:hover{background:#edf2fb}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.answers button{text-align:left}.status{background:#f0f4f8;border-radius:8px;padding:12px;min-height:42px;white-space:pre-wrap}.result{font-weight:700;min-height:30px}a{color:#1956a0}@media(max-width:550px){.wrap{padding:15px}.answers{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>클래식 음악 퀴즈 · 임베딩 테스트 V1</h1><p class="muted">그리그 피아노 협주곡 1악장 · YouTube 공식 플레이어 시험</p><div class="player"><div id="ytplayer"></div></div><div class="buttons"><button id="play">▶ 재생</button><button id="pause">Ⅱ 일시정지</button><button id="stop">■ 정지</button><button id="reset">↻ 문제 다시 풀기</button></div><p><strong>문제.</strong> 지금 들리는 음악의 제목은 무엇일까요?</p><div class="answers" id="answers"><button data-answer="0">① 베토벤 피아노 협주곡 5번</button><button data-answer="1">② 그리그 피아노 협주곡 A단조</button><button data-answer="2">③ 차이콥스키 피아노 협주곡 1번</button><button data-answer="3">④ 라흐마니노프 피아노 협주곡 2번</button></div><p id="result" class="result" aria-live="polite"></p><p class="muted">재생 시작 후 최대 2분까지만 들려줍니다. 정답을 선택하면 플레이어에 정지 명령을 보냅니다.</p><div id="status" class="status" aria-live="polite">플레이어 API 로딩 중…</div><p class="muted">원본: <a href="https://sunkim11354.com/classical-music/grieg-piano-concerto-first-movement" target="_blank" rel="noopener">홈페이지 작품 페이지</a> · <a href="https://www.youtube.com/watch?v=yI4Cpo29dao" target="_blank" rel="noopener">YouTube 원본</a></p></main><script>
'use strict';
let player=null, ready=false, answered=false, timer=null, seconds=0;
const status=document.getElementById('status');
const result=document.getElementById('result');
function msg(s){status.textContent=s;}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function stopMusic(){stopTimer();if(ready&&player){try{player.stopVideo();return true}catch(e){msg('정지 명령 오류: '+e.message)}}return false;}
function startTimer(){stopTimer();seconds=0;timer=setInterval(()=>{seconds++;if(seconds>=120){stopMusic();msg('2분 청취 제한에 도달하여 재생을 정지했습니다.');}},1000);}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player('ytplayer',{height:'315',width:'560',videoId:'yI4Cpo29dao',playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;msg('플레이어 준비 완료. ▶ 재생을 눌러 시험하세요.');},onStateChange:(e)=>{const names={[-1]:'시작 전',[0]:'종료',[1]:'재생 중',[2]:'일시정지',[3]:'버퍼링',[5]:'준비됨'};if(e.data===YT.PlayerState.PLAYING){if(!answered&&!timer)startTimer();if(answered){stopMusic();return;}}if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED)stopTimer();msg('YouTube 상태: '+(names[e.data]||e.data)+(answered?' / 정답 선택 완료':''));},onError:(e)=>{stopTimer();msg('YouTube 재생 오류 코드 '+e.data+' — 영상 소유자의 임베딩 제한 또는 재생 환경 문제일 수 있습니다.');}}});};
const api=document.createElement('script');api.src='https://www.youtube.com/iframe_api';api.onerror=()=>msg('YouTube API를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');document.head.appendChild(api);
document.getElementById('play').onclick=()=>{if(answered){msg('문제 종료 상태입니다. 다시 풀기를 누르세요.');return;}if(!ready){msg('플레이어 준비 중입니다. 잠시 기다려 주세요.');return;}try{player.playVideo();msg('재생 요청을 보냈습니다.')}catch(e){msg('재생 실패: '+e.message)}};
document.getElementById('pause').onclick=()=>{stopTimer();if(ready)player.pauseVideo();msg('일시정지를 요청했습니다.');};
document.getElementById('stop').onclick=()=>{stopMusic();msg('정지 명령을 보냈습니다.');};
document.getElementById('reset').onclick=()=>{stopMusic();answered=false;seconds=0;result.textContent='';document.querySelectorAll('#answers button').forEach(b=>b.disabled=false);msg('다시 풀기 준비 완료.');};
document.querySelectorAll('#answers button').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const didStop=stopMusic();document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);result.textContent=b.dataset.answer==='1'?'정답입니다! 그리그 피아노 협주곡 A단조, 제1악장입니다.':'아쉽습니다. 정답은 ② 그리그 피아노 협주곡 A단조입니다.';msg(didStop?'정답 선택 → YouTube 정지 명령 전송 완료.':'정답 선택 완료. 플레이어 준비 전이어서 정지 명령을 보낼 수 없었습니다.');});
</script></body></html>
